<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuadro de cotización</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E0A80B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cotizador">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEF;
  --surface:#FFFFFF;
  --surface-2:#F3F5F7;
  --ink:#14181C;
  --muted:#5D6874;
  --line:#D2D8DE;
  --accent:#E0A80B;
  --accent-ink:#171407;
  --acero:#5E7186;
  --alu:#8E9AA3;
  --cobre:#B65E28;
  --danger:#B3261E;
  --shadow:0 1px 0 rgba(20,24,28,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121518;
    --surface:#1B1F24;
    --surface-2:#22272D;
    --ink:#E9EDF1;
    --muted:#98A3AE;
    --line:#2E353D;
    --accent:#F2BD1D;
    --accent-ink:#14100A;
    --acero:#8BA0B6;
    --alu:#AFBAC3;
    --cobre:#DE8146;
    --danger:#F2756B;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121518;
  --surface:#1B1F24;
  --surface-2:#22272D;
  --ink:#E9EDF1;
  --muted:#98A3AE;
  --line:#2E353D;
  --accent:#F2BD1D;
  --accent-ink:#14100A;
  --acero:#8BA0B6;
  --alu:#AFBAC3;
  --cobre:#DE8146;
  --danger:#F2756B;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.4;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 96px}
h1{font-size:1.28rem;font-weight:700;letter-spacing:-.02em;margin:0 0 2px}
.sub{color:var(--muted);font-size:.86rem;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{
  display:flex;align-items:center;gap:10px;justify-content:center;
  min-height:60px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);font:600 1rem Archivo,sans-serif;cursor:pointer;
}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.seg svg{flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  flex:1 1 30%;min-height:46px;border-radius:11px;cursor:pointer;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
  font:500 .92rem Archivo,sans-serif;padding:6px 8px;
  border-left-width:5px;border-left-color:var(--mat,var(--line));
}
.chip[aria-pressed="true"]{background:var(--surface-2);border-color:var(--ink);border-left-color:var(--mat)}
label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px}
input,select{
  width:100%;min-height:50px;padding:10px 12px;border-radius:11px;
  border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);
  font:500 1.02rem Archivo,sans-serif;font-variant-numeric:tabular-nums;
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.out{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.big{font-size:2.15rem;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.08}
.big small{display:block;font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:0}
.rows{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:.94rem;font-variant-numeric:tabular-nums}
.row span:first-child{color:var(--muted)}
.tolnote{margin-top:10px;font-size:.78rem;color:var(--muted)}
details summary{cursor:pointer;font-size:.86rem;color:var(--muted);padding:6px 0}
.btn{
  width:100%;min-height:54px;border:none;border-radius:13px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font:700 1rem Archivo,sans-serif;
}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:none}
.item h3{margin:0 0 2px;font-size:.95rem;font-weight:600}
.item p{margin:0;font-size:.79rem;color:var(--muted)}
.item .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.del{border:none;background:transparent;color:var(--danger);font:600 .8rem Archivo,sans-serif;cursor:pointer;padding:4px 0 0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:2px solid var(--ink)}
.total b{font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.empty{color:var(--muted);font-size:.9rem;margin:4px 0 0}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;
  font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .18s
}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cuadro de cotización</h1>
  <p class="sub">Peso y valor de redondos y placas, con tolerancia incluida.</p>

  <div class="seg" role="group" aria-label="Forma">
    <button type="button" id="fRedondo" aria-pressed="true">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="13" cy="13" r="2" fill="currentColor"/></svg>
      Redondo
    </button>
    <button type="button" id="fPlaca" aria-pressed="false">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3.5 8.5h13v10h-13z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6.5 5.5h13v10M16.5 8.5l3-3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Placa
    </button>
  </div>

  <div class="card">
    <div class="field">
      <label id="lblMat">Material</label>
      <div class="chips" role="group" aria-labelledby="lblMat" id="mats"></div>
    </div>

    <div id="camposRedondo">
      <div class="grid">
        <div class="field"><label for="diam">Diámetro (mm)</label><input id="diam" inputmode="decimal" value="55"></div>
        <div class="field"><label for="largoR">Largo (mm)</label><input id="largoR" inputmode="decimal" value="195"></div>
      </div>
    </div>

    <div id="camposPlaca" hidden>
      <div class="grid">
        <div class="field"><label for="ancho">Ancho (mm)</label><input id="ancho" inputmode="decimal" value="45"></div>
        <div class="field"><label for="largoP">Largo (mm)</label><input id="largoP" inputmode="decimal" value="200"></div>
        <div class="field"><label for="espesor">Espesor (mm)</label><input id="espesor" inputmode="decimal" value="57"></div>
        <div class="field"><label for="present">Presentación</label>
          <select id="present"><option>ORIGINAL</option><option>PREMAQUINADO</option><option>MODULADO</option></select>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="field"><label for="unidades">Unidades</label><input id="unidades" inputmode="numeric" value="1"></div>
      <div class="field"><label for="precio">Valor / kg</label><input id="precio" inputmode="decimal" value="28000"></div>
    </div>

    <details>
      <summary>Ajustar tolerancias</summary>
      <div class="grid" style="margin-top:8px">
        <div class="field"><label for="tolA" id="lblTolA">Tol. diámetro (mm)</label><input id="tolA" inputmode="decimal"></div>
        <div class="field"><label for="tolB">Tol. largo (mm)</label><input id="tolB" inputmode="decimal"></div>
        <div class="field" id="wrapTolC" hidden><label for="tolC">Tol. espesor (mm)</label><input id="tolC" inputmode="decimal"></div>
      </div>
      <button type="button" class="btn ghost" id="autoTol">Volver a tolerancia automática</button>
    </details>
  </div>

  <div class="out">
    <div class="big" id="valorTotal">$0<small>Valor total</small></div>
    <div class="rows">
      <div class="row"><span>Peso unitario</span><span id="pesoUnit">0 kg</span></div>
      <div class="row"><span>Peso total</span><span id="pesoTotal">0 kg</span></div>
      <div class="row"><span>Valor unitario</span><span id="valorUnit">$0</span></div>
    </div>
    <p class="tolnote" id="tolNote"></p>
  </div>

  <button type="button" class="btn" id="agregar">Agregar a la cotización</button>

  <div class="card" style="margin-top:14px">
    <h2 style="margin:0 0 6px;font-size:1rem;font-weight:600">Cotización</h2>
    <div id="lista"><p class="empty">Todavía no hay ítems. Agregá el primero arriba.</p></div>
    <div class="total"><span>Total</span><b id="granTotal">$0</b></div>
    <div class="stack" style="margin-top:12px">
      <button type="button" class="btn ghost" id="copiar">Copiar cotización</button>
      <button type="button" class="btn ghost" id="limpiar">Vaciar cotización</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const MAT = {
  ACERO:      {nombre:"Acero",       kRedondo:0.0062,  kPlaca:0.00785, color:"var(--acero)", precio:28000},
  DURALUMINIO:{nombre:"Duraluminio", kRedondo:0.0022,  kPlaca:0.0028,  color:"var(--alu)",   precio:18000},
  COBRE:      {nombre:"Cobre",       kRedondo:0.00685, kPlaca:0.0088,  color:"var(--cobre)", precio:52000}
};

let forma = "REDONDO";
let material = "ACERO";
let tolManual = {a:null, b:null, c:null};
let items = [];

const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const money = n => new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(n||0);
const kg = n => (n||0).toLocaleString("es-CO",{minimumFractionDigits:2,maximumFractionDigits:2}) + " kg";

/* ---- Tolerancias automáticas (mismas reglas del cuadro en Excel) ---- */
function tolAuto(){
  if (forma === "REDONDO"){
    const d = num($("diam").value);
    let td = 1;
    if (material === "ACERO")  td = d <= 80 ? 1 : (d <= 200 ? 2 : 3);
    if (material === "COBRE")  td = d <= 80 ? 1 : 2;
    return {a:td, b:3, c:0, txtA:"diámetro", txtB:"largo"};
  }
  const p = $("present").value, e = num($("espesor").value);
  if (p === "PREMAQUINADO" || p === "MODULADO") return {a:5, b:5, c:5, txtA:"ancho", txtB:"largo"};
  let te = 1;
  if (material === "ACERO") te = e <= 35 ? 1 : (e <= 100 ? 2 : 3);
  return {a:3, b:3, c:te, txtA:"ancho", txtB:"largo"};
}
function tolVigente(){
  const a = tolAuto();
  return {
    a: tolManual.a === null ? a.a : tolManual.a,
    b: tolManual.b === null ? a.b : tolManual.b,
    c: tolManual.c === null ? a.c : tolManual.c,
    auto: tolManual.a === null && tolManual.b === null && tolManual.c === null,
    txtA:a.txtA, txtB:a.txtB
  };
}

/* ---- Cálculo ---- */
function calcular(){
  const t = tolVigente(), m = MAT[material];
  let peso;
  if (forma === "REDONDO"){
    const d = num($("diam").value) + t.a, l = num($("largoR").value) + t.b;
    peso = (d * d * m.kRedondo) / 1000 * l;
  } else {
    const an = num($("ancho").value) + t.a, la = num($("largoP").value) + t.b, es = num($("espesor").value) + t.c;
    peso = (an * la * es * m.kPlaca) / 1000;
  }
  const u = Math.max(0, num($("unidades").value));
  const pk = num($("precio").value);
  return {peso, pesoTotal:peso*u, valorUnit:peso*pk, valorTotal:peso*u*pk, unidades:u, precio:pk, tol:t};
}

function render(){
  const r = calcular();
  $("valorTotal").innerHTML = money(r.valorTotal) + "<small>Valor total</small>";
  $("pesoUnit").textContent = kg(r.peso);
  $("pesoTotal").textContent = kg(r.pesoTotal);
  $("valorUnit").textContent = money(r.valorUnit);

  const t = r.tol;
  let txt = "Tolerancia " + (t.auto ? "automática" : "manual") + ": +" + t.a + " mm " + t.txtA + ", +" + t.b + " mm " + t.txtB;
  if (forma === "PLACA") txt += ", +" + t.c + " mm espesor";
  $("tolNote").textContent = txt;

  if (document.activeElement !== $("tolA")) $("tolA").value = t.a;
  if (document.activeElement !== $("tolB")) $("tolB").value = t.b;
  if (document.activeElement !== $("tolC")) $("tolC").value = t.c;
}

function pintarMateriales(){
  const cont = $("mats");
  cont.innerHTML = "";
  Object.entries(MAT).forEach(([k,v]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = v.nombre;
    b.style.setProperty("--mat", v.color);
    b.setAttribute("aria-pressed", k === material);
    b.onclick = () => { material = k; $("precio").value = MAT[k].precio; pintarMateriales(); render(); };
    cont.appendChild(b);
  });
}

function setForma(f){
  forma = f;
  $("fRedondo").setAttribute("aria-pressed", f === "REDONDO");
  $("fPlaca").setAttribute("aria-pressed", f === "PLACA");
  $("camposRedondo").hidden = f !== "REDONDO";
  $("camposPlaca").hidden = f !== "PLACA";
  $("wrapTolC").hidden = f !== "PLACA";
  $("lblTolA").textContent = f === "REDONDO" ? "Tol. diámetro (mm)" : "Tol. ancho (mm)";
  render();
}

/* ---- Lista ---- */
function descripcion(){
  const t = tolVigente();
  if (forma === "REDONDO") return "Ø" + num($("diam").value) + " × " + num($("largoR").value) + " mm · +" + t.a + "/+" + t.b;
  return num($("ancho").value) + " × " + num($("largoP").value) + " × " + num($("espesor").value) + " mm · " + $("present").value;
}
function pintarLista(){
  const cont = $("lista");
  if (!items.length){ cont.innerHTML = '<p class="empty">Todavía no hay ítems. Agregá el primero arriba.</p>'; }
  else {
    cont.innerHTML = "";
    items.forEach((it, i) => {
      const d = document.createElement("div");
      d.className = "item";
      const izq = document.createElement("div");
      izq.innerHTML = "<h3>" + it.material + " · " + it.forma.toLowerCase() + "</h3><p>" + it.desc + "</p><p>" +
        it.unidades + " und · " + kg(it.pesoTotal) + " · " + money(it.precio) + "/kg</p>";
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "Quitar"; del.onclick = () => { items.splice(i,1); pintarLista(); guardar(); };
      izq.appendChild(del);
      const der = document.createElement("div");
      der.className = "val"; der.textContent = money(it.valorTotal);
      d.append(izq, der);
      cont.appendChild(d);
    });
  }
  $("granTotal").textContent = money(items.reduce((s,i) => s + i.valorTotal, 0));
}
function textoCotizacion(){
  const l = items.map(i => "• " + i.material + " " + i.forma.toLowerCase() + " " + i.desc + " — " + i.unidades +
    " und, " + kg(i.pesoTotal) + ", " + money(i.valorTotal));
  return "CUADRO DE COTIZACIÓN\n" + l.join("\n") + "\nTOTAL: " + money(items.reduce((s,i)=>s+i.valorTotal,0));
}

/* ---- Guardado local (solo en este dispositivo) ---- */
function guardar(){
  try{
    localStorage.setItem("cotiz_items", JSON.stringify(items));
    localStorage.setItem("cotiz_precios", JSON.stringify(
      Object.fromEntries(Object.entries(MAT).map(([k,v]) => [k, v.precio]))));
  }catch(e){}
}
function cargar(){
  try{
    const it = localStorage.getItem("cotiz_items");
    if (it) items = JSON.parse(it) || [];
    const pr = JSON.parse(localStorage.getItem("cotiz_precios") || "null");
    if (pr) Object.keys(MAT).forEach(k => { if (typeof pr[k] === "number") MAT[k].precio = pr[k]; });
  }catch(e){ items = []; }
}

let tid;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(tid); tid = setTimeout(() => t.classList.remove("on"), 1800);
}

/* ---- Eventos ---- */
$("fRedondo").onclick = () => setForma("REDONDO");
$("fPlaca").onclick = () => setForma("PLACA");
["diam","largoR","ancho","largoP","espesor","unidades","precio"].forEach(id => $(id).addEventListener("input", render));
$("present").addEventListener("change", render);
$("precio").addEventListener("input", () => { MAT[material].precio = num($("precio").value); guardar(); });
$("tolA").addEventListener("input", e => { tolManual.a = e.target.value === "" ? null : num(e.target.value); render(); });
$("tolB").addEventListener("input", e => { tolManual.b = e.target.value === "" ? null : num(e.target.value); render(); });
$("tolC").addEventListener("input", e => { tolManual.c = e.target.value === "" ? null : num(e.target.value); render(); });
$("autoTol").onclick = () => { tolManual = {a:null,b:null,c:null}; render(); toast("Tolerancia automática"); };

$("agregar").onclick = () => {
  const r = calcular();
  if (r.pesoTotal <= 0){ toast("Revisá las medidas y las unidades"); return; }
  items.push({material:MAT[material].nombre, forma, desc:descripcion(), unidades:r.unidades,
              pesoTotal:r.pesoTotal, precio:r.precio, valorTotal:r.valorTotal});
  pintarLista(); guardar(); toast("Ítem agregado");
};
$("copiar").onclick = async () => {
  if (!items.length){ toast("La cotización está vacía"); return; }
  const txt = textoCotizacion();
  try{ await navigator.clipboard.writeText(txt); toast("Cotización copiada"); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Cotización copiada"); }catch(_){ toast("No se pudo copiar"); }
    ta.remove();
  }
};
$("limpiar").onclick = () => { items = []; pintarLista(); guardar(); toast("Cotización vacía"); };

cargar();
pintarMateriales();
$("precio").value = MAT[material].precio;
setForma("REDONDO");
pintarLista();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
